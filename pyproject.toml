[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taklib"
version = "0.1.0"
description = "Cursor-on-Target toolkit for the TAK hackathon — build, send, receive"
requires-python = ">=3.10"
# Deliberately empty: taklib is pure standard library, so a failed pip install
# at the venue can never stop us demoing. See requirements.txt for the
# optional extras.
dependencies = []

[project.optional-dependencies]
# pip install -e ".[extras]"
extras = [
    "pytak>=6.0.0",      # alternative async sender, if you prefer its worker model
    "takproto>=3.0.0",   # decode TAK Protocol v1 (protobuf) servers
]

# Speech input. taklib.voice imports these lazily, so none of it is needed
# unless you actually call a backend - `import taklib` stays dependency-free.
# pip install -e ".[voice]"
voice = [
    "moonshine-voice>=0.1.2",   # fastest, best for short radio traffic
]
# The whisper fallback, if you'd rather have output you can compare against
# something familiar: pip install -e ".[voice-whisper]"
voice-whisper = [
    "faster-whisper>=1.0.0",
]
# Phi-4-multimodal: audio -> JSON in one model. ~3 GB VRAM at 4-bit.
# Install torch from pytorch.org first to get the right CUDA build.
voice-phi4 = [
    "transformers>=4.48",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
]

[project.scripts]
tak = "tak:main"

[tool.setuptools]
packages = ["taklib"]
py-modules = ["tak"]
